function playNote(id){const el=document.querySelector('[data-n="'+id+'"]');if(!el)return;el.scrollIntoView({block:'center'});el.classList.remove('go');el.classList.add('wait');const r=el.getBoundingClientRect(),a=document.createElement('div');a.className='ast2';a.textContent='☄️';document.body.appendChild(a);const sx=innerWidth-40,sy=-80,tx=r.left+r.width/2,ty=Math.max(40,r.top+20);a.animate([{transform:`translate(${sx}px,${sy}px) scale(.8)`},{transform:`translate(${tx}px,${ty}px) scale(1.7)`,opacity:1,offset:.92},{transform:`translate(${tx}px,${ty}px) scale(3)`,opacity:0}],{duration:1200,easing:'cubic-bezier(.45,0,.9,.6)'}).onfinish=()=>{a.remove();el.classList.remove('wait');void el.offsetWidth;el.classList.add('go');el.animate([{transform:'translate(0,0)'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-3px)'},{transform:'translate(0,0)'}],{duration:350})}}
A.nsave=()=>{const t=$('#nt').value.trim(),st=$('#ns').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!t||!st.length)return toast('Add a task name and at least one step');const id='n'+Date.now();S.notes.unshift({id,title:t,steps:st});render();playNote(id)};
A.nplay=i=>playNote(i);A.ndel=i=>{S.notes=S.notes.filter(n=>n.id!==i);render()};
dock();
let FM=false,wl=null;S.flog=S.flog||{};S.links=S.links||[];
const WK=[['clock','Clock'],['prog','Task progress'],['focus','Focus goal'],['hab','Habits'],['timer','Timer']],WD={clock:1,prog:1,focus:1,hab:1,timer:1};
function wclk(){const n=new Date();document.querySelectorAll('[data-wclk]').forEach(e=>e.textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}));const d=$('#wdate');if(d)d.textContent=n.toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'});document.querySelectorAll('[data-wt]').forEach(e=>e.textContent=fmt(T.left))}
function widgets(){const w={...WD,...(S.cfg.w||{})},d=dk(),ts=tasksOf(d),dn=ts.filter(t=>t.done).length,p=ts.length?Math.round(dn/ts.length*100):0,m=mins(d),gp=Math.min(100,Math.round(m/S.cfg.goal*100)),dots=(pc,n=20)=>`<div class="dots">${[...Array(n)].map((_,i)=>`<i class="${i<Math.round(pc/100*n)?'on':''}"></i>`).join('')}</div>`,hd=S.habits.filter(h=>(S.hlog[d]||[]).includes(h.id)).length,x=[];
w.clock&&x.push(`<div class="wg"><small id="wdate"></small><div class="wdot" data-wclk></div></div>`);
w.prog&&x.push(`<div class="wg"><small>Task progress today</small><div class="wdot">${dn}/${ts.length}</div>${dots(p)}<small>${p}% complete · ${m} min focused</small></div>`);
w.focus&&x.push(`<div class="wg"><small>Focus goal</small><div class="wdot">${gp}%</div>${dots(gp)}<small>${m} of ${S.cfg.goal} min</small></div>`);
w.hab&&x.push(`<div class="wg"><small>Habits today</small><div class="wdot">${hd}/${S.habits.length}</div><div class="dots">${S.habits.map(h=>`<i class="${(S.hlog[d]||[]).includes(h.id)?'on':''}" style="width:12px;height:12px"></i>`).join('')}</div></div>`);
w.timer&&x.push(`<div class="wg"><small>${T.mode==='focus'?'Focus':'Break'}</small><div class="rec ${T.run?'run':''}"><u></u><span class="wdot" style="font-size:26px" data-wt>${fmt(T.left)}</span></div><div class="r"><button class="b" data-a="start">${T.run?'Pause':'Start'}</button><button class="b" data-a="fm">Focus mode</button></div></div>`);
return x.length?`<div class="wgrid">${x.join('')}</div>`:''}
function flogHtml(d){const L=(S.flog||{})[d]||[],q=sessFl(d),sx=q?`<br><h3>Focus sessions</h3>${q}`:'';return sx+(L.length?`<br><h3>Time spent this day</h3>${L.map(e=>`<div class="t"><span>${esc(e.t)}</span><b>${Math.round(e.s/60)} min</b></div>`).join('')}`:'')}

V_.links=function(){const yt=l=>{const m=l.u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:''},row=l=>`<div class="t">${l.k==='yt'&&yt(l)?`<img src="https://i.ytimg.com/vi/${yt(l)}/mqdefault.jpg" alt="" style="width:72px;border-radius:8px" onerror="this.remove()">`:''}<span>${esc(l.t)}<br><small class="m">${esc(l.u.replace(/^https?:\/\//,'').slice(0,48))}</small></span><a class="b p" href="${esc(l.u)}" target="_blank" rel="noopener">Open</a><button class="b x" data-a="ldel" data-i="${l.id}">✕</button></div>`,L=S.links||[];

Object.assign(A,{
ladd:()=>{let u=$('#lu').value.trim();const t=$('#lt').value.trim();if(!u)return toast('Paste a link');if(!/^https?:\/\//i.test(u))u='https://'+u;S.links.unshift({id:'l'+Date.now(),t:t||u,u,k:$('#lk').value});render()},
ldel:i=>{S.links=S.links.filter(l=>l.id!==i);render()},
wtog:k=>{S.cfg.w={...WD,...(S.cfg.w||{})};S.cfg.w[k]=S.cfg.w[k]?0:1;render()},
fm:async()=>{FM=!FM;document.body.classList.toggle('fm',FM);if(FM){view='timer';try{await document.documentElement.requestFullscreen()}catch(e){}try{wl=await navigator.wakeLock.request('screen')}catch(e){}toast('Focus mode on. Turn on Do Not Disturb on your phone to silence other apps.')}else{try{document.fullscreenElement&&await document.exitFullscreen()}catch(e){}try{wl&&wl.release()}catch(e){}wl=null;toast('Focus mode off')}render()}});

const SG="'Space Grotesk',system-ui,sans-serif",DD="'Manrope','Doto',ui-monospace,monospace",DP="'Manrope','DotGothic16',ui-monospace,monospace",NF=(k,n,g,f,fb)=>[k,n,g,"'"+f+"',"+fb,"'"+f+"',"+fb],SS='system-ui,sans-serif';
/* [key,label,google family spec,body stack,heading stack]. Nothing styles put 'Manrope' (digits only) first, so numbers never use the dot font. */
const FONTS=[['nothing','Nothing Classic','',SG,"'Doto','DotGothic16',ui-monospace,monospace"],['dot','Nothing Dot','',DD,DD],['pixel','Nothing Pixel','DotGothic16',DP,DP],['sg','Space Grotesk','',SG,SG],
NF('poppins','Poppins','Poppins:wght@400;600;700','Poppins',SS),NF('outfit','Outfit','Outfit:wght@400;700','Outfit',SS),NF('sora','Sora','Sora:wght@400;700','Sora',SS),NF('syne','Syne','Syne:wght@400;700','Syne',SS),NF('unbounded','Unbounded','Unbounded:wght@400;700','Unbounded',SS),NF('bricolage','Bricolage Grotesque','Bricolage+Grotesque:wght@400;700','Bricolage Grotesque',SS),NF('playfair','Playfair Display','Playfair+Display:wght@400;700','Playfair Display','Georgia,serif'),NF('spacemono','Space Mono','Space+Mono:wght@400;700','Space Mono','ui-monospace,monospace'),NF('jetbrains','JetBrains Mono','JetBrains+Mono:wght@400;700','JetBrains Mono','ui-monospace,monospace'),NF('caveat','Caveat','Caveat:wght@400;700','Caveat','cursive'),NF('orbitron','Orbitron','Orbitron:wght@400;700','Orbitron',SS)],FL={};
function loadFont(k){const f=FONTS.find(x=>x[0]===k);if(!f||!f[2]||FL[k])return;FL[k]=1;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f[2]+'&display=swap';document.head.appendChild(l)}

function fontCard(){const cur=(FONTS.find(x=>x[0]===S.cfg.font)||FONTS[0])[0];return `<div class="c" style="grid-column:1/-1"><h3>Font</h3><p class="m">Pick a style for the whole app. Numbers always stay in a clean font, even with the Nothing styles.</p><div class="fp">${FONTS.map(x=>`<button class="b ${x[0]===cur?'p':''}" style="font-family:${x[4]}" data-a="font" data-i="${x[0]}">${x[1]}</button>`).join('')}</div><div class="fpv">The quick brown fox jumps over 25 lazy dogs</div></div>`}

/* self-update: lets a new index.html reach phones even though sw.js serves cached files first */
if('caches'in window)addEventListener('load',()=>setTimeout(()=>{if(!navigator.onLine)return;fetch('index.html',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{if(!t)return;caches.keys().then(ks=>ks.filter(k=>k.startsWith('focusflow')).forEach(k=>caches.open(k).then(c=>c.match('index.html').then(old=>old&&old.text().then(ot=>{if(ot!==t){const h={headers:{'Content-Type':'text/html'}};c.put('index.html',new Response(t,h));c.put('./',new Response(t,h));if(sessionStorage.ffu!==String(t.length)){sessionStorage.ffu=String(t.length);toast('New version ready. Close and reopen the app to update.')}}})))))}).catch(()=>{})},4000));
