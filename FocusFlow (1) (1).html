<script>
const $=s=>document.querySelector(s),K='ff_data',TK='ff_timer';
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

const rem={};setInterval(()=>{tick();clock();const n=new Date(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');tasksOf(dk()).forEach(t=>{if(t.time===h&&!t.done&&!rem[t.id+h]){rem[t.id+h]=1;notify('Task reminder',t.title)}})},1000);
